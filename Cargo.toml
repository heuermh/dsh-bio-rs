[package]
name = "dsh-bio"
version = "4.0.0-snapshot1"
edition = "2024"

[dependencies]
bstr = { version = "1.9.0", default-features = false, features = ["std"] }
clap = { version = "4.6.0", features = ["derive", "env", "cargo"] }
duckdb = { version = "1.20000.0", features = ["bundled", "parquet"] }
env_logger = "0.11.10"
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
log = "0.4.29"
noodles = { version = "0.118.0", features = ["bgzf", "fasta", "fastq", "vcf"] }

[dev-dependencies]
tempfile = "3.27.0"
